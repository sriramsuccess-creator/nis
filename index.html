<style>

<script>
const DATA=[["c1","In the financial market structure, money market, debt market and equity market are examples of:",["Types of markets","Issuers","Intermediaries","Regulatory bodies"],0,"The financial market consists of various markets (money, debt, equity), investors, issuers, intermediaries and regulators. (1.1)"],["c1","Buyers of securities in the financial market are called:",["Investors","Issuers","Regulators","Intermediaries"],0,"Investors buy securities, while issuers are the users of funds. (1.1)"],["c1","Issuers of securities are best described as:",["Registrars","Providers of regulation","Buyers of securities","Users of funds"],3,"Issuers raise funds by issuing securities. (1.1)"],["c1","The securities markets provide a regulated institutional framework for the flow of:",["Only bank deposits","Only foreign exchange","Only gold","Capital (equity and debt) from investors to businesses"],3,"They channel allocation of savings to investments. (1.1)"],["c1","Savings of households, business firms and government can be channelised through the securities market to fund:",["Only government budgets","Capital requirements of business enterprises and government","Only insurance claims","Only bank loans"],1,"The securities market links savings with investment. (1.1)"],["c1","Savings are linked to investments by intermediaries through financial products called:",["Policies","Securities","Chits","Deposits"],1,"Securities are financial instruments issued to raise funds. (1.1)"],["c1","The term \"securities\" is defined in which provision?",["Section 10 of the Depositories Act","Section 5 of the SEBI Act","Section 2(h) of the SCRA, 1956","Section 2(h) of the Companies Act"],2,"SCRA, 1956 Section 2(h) defines securities. (1.2)"],["c1","Which of the following is included in the definition of securities under SCRA?",["Government securities","Provident fund balances","Chit fund contributions","Bank fixed deposits"],0,"Government securities are listed in the definition. (1.2)"],["c1","Which of these is NOT a security?",["Shares and debentures","Units of a mutual fund scheme","Derivatives","Bank fixed deposit"],3,"Bank deposits are not transferable securities. (1.2)"],["c1","Units issued under a mutual fund scheme are:",["Bank deposits","Not securities","Securities","Insurance policies"],2,"Units under any mutual fund scheme are included in the SCRA definition. (1.2)"],["c1","ULIPs (unit linked insurance policies) are:",["Derivatives","Government securities","Excluded from the definition of securities","Included in securities"],2,"The SCRA excludes instruments providing a combined benefit of risk on life and investment issued by an insurer. (1.2)"],["c1","Security receipts as defined under the SARFAESI Act, 2002 are:",["Included in the SCRA definition of securities","Only government papers","Only bank deposits","Not securities"],0,"Clause (d) includes security receipts. (1.2)"],["c1","Which of the following is a derivative as per SCRA?",["A provident fund","A bank savings account","A fixed deposit","A contract deriving its value from prices or index of prices of underlying securities"],3,"The SCRA treats such contracts as derivatives, which are securities. (1.2)"],["c1","Commodity derivatives, per the SCRA definition, are:",["Only for foreign investors","Only for banks","Included in derivatives","Excluded from derivatives"],2,"Item (iii) of the footnote includes commodity derivatives. (1.2)"],["c1","The Central Government may declare other instruments as securities. Which of these has been so declared?",["Electronic gold receipts","Fixed deposits of companies","Bank savings deposits","Chit fund units"],0,"Electronic Gold Receipt was notified on December 24, 2021. (1.2)"],["c1","Electronic Gold Receipt was declared a security by Gazette notification dated:",["March 31, 2023","January 1, 2020","July 16, 2022","December 24, 2021"],3,"The notification declared EGRs as securities. (1.2)"],["c1","\"Zero Coupon Zero Principal Instruments\" are issued by:",["Not-for-profit organisations registered with Social Stock Exchanges","Mutual funds","Banks","The RBI"],0,"They were declared securities by notification dated July 16, 2022. (1.2)"],["c1","Onshore rupee bonds issued by multilateral institutions like ADB and IFC are:",["Derivatives","Securities declared by the Central Government","Money market instruments only","Not securities"],1,"They are among the instruments declared as securities. (1.2)"],["c1","A security represents:",["The terms of exchange of money between two parties","A gift","A tax receipt","A government grant"],0,"Securities are issued by companies, financial institutions or government and bought by investors. (1.2.1)"],["c1","Securities are classified broadly into:",["Cash and gold","Primary and secondary","Equity and debt","Domestic and foreign"],2,"The terms of issue, rights, risk and return vary between the two. (1.2.1)"],["c1","In the context of securities, \"return\" refers to:",["The cost of issue","The regulator's fee","The possibility that expected returns may not materialise","The benefits an investor will receive from the security"],3,"Risk is the possibility that expected returns may not materialise. (1.2.1)"],["c1","A bond is a:",["Mutual fund unit","Equity security","Debt security representing a borrowing of the company","Derivative"],2,"The amount borrowed is repaid at the end of the specified period. (1.2.1)"],["c1","The return on a bond is typically in the form of:",["Rights shares","Dividend","Bonus shares","Interest paid periodically"],3,"Interest is paid at a rate and frequency specified in the security. (1.2.1)"],["c1","The main risk to a bond investor is:",["Default on interest or principal by the company","Bonus issue","Dividend tax","Stock split"],0,"The company may fall into bad times and default. (1.2.1)"],["c1","A bank fixed deposit receipt, compared to a certificate of deposit (CD), is:",["Freely transferable","A mutual fund unit","A derivative","Not transferable"],3,"A CD is a security that can be transferred before maturity, whereas a deposit receipt cannot. (1.2.1)"],["c1","The price at which a CD changes hands before maturity is determined by:",["The RTA","The market rate agreed by both parties at that time","The depository","The regulator"],1,"The price depends on the market rate prevailing at transfer. (1.2.1)"],["c1","Which of the following is NOT a security?",["Shares","Government bonds","Debentures","Company fixed deposit"],3,"Company fixed deposits are not transferable securities. (1.2.1)"],["c1","Chit funds and benefit funds are:",["Not securities","Securities","Government securities","Derivatives"],0,"They are financial arrangements between two parties and not in the form of transferable securities. (1.2.1)"],["c1","Insurance policies are:",["Contracts and not securities","Bonds","Securities","Mutual funds"],0,"Insurance policies are contracts, not securities. (1.2.1)"],["c1","Investment in provident funds or pension funds is:",["Investment in securities","Investment in derivatives","Not investment in securities","Investment in bonds"],2,"These are financial arrangements, not securities. (1.2.1)"],["c1","A security that is structured so that its terms are standard and accepted by both parties gives:",["No return","Less flexibility","More flexibility to both parties","No liquidity"],2,"Structuring a monetary transaction using a security increases flexibility. (1.2.1)"],["c1","The securities market has two interdependent segments:",["Retail and wholesale","Spot and forward only","Primary and secondary markets","Money and forex"],2,"The primary and secondary markets are inseparable. (1.3)"],["c1","The primary market is also called the:",["Spot market","New issue market","Exchange market","Old issue market"],1,"Issuers raise capital by issuing securities to investors. (1.3)"],["c1","The secondary market is also called the:",["New issue market","Forex market","Stock/securities exchange","Money market"],2,"It facilitates trade in already-issued securities. (1.3)"],["c1","The primary market creates financial assets, and the secondary market:",["Destroys them","Makes them marketable","Taxes them","Prices them by decree"],1,"The secondary market lets investors exit and transfers risk. (1.3)"],["c1","The risk in a security investment is transferred from seller to buyer in the:",["Money lenders' market","Regulator's office","Primary market","Secondary market"],3,"This transfer happens on the exchange. (1.3)"],["c1","The role of stock exchanges in the primary market is limited to:",["Listing of securities","Allotment","Underwriting","Pricing the issue"],0,"Exchanges list the securities after issue. (1.3)"],["c1","Registrars and Transfer Agents, custodians and depositories provide infrastructure services to:",["Only the primary market","Only the secondary market","Both primary and secondary markets","Only the money market"],2,"They are capital market intermediaries serving both markets. (1.3)"],["c1","The three main components of a securities market are:",["Only exchanges and depositories","Banks, insurers and brokers","Investors, issuers and intermediaries","Only issuers and regulators"],2,"Regulatory control and supervision apply to the whole process. (1.3)"],["c1","Issuers create the:",["Supply of capital","Regulation","Demand for capital","Settlement system"],2,"Investors provide the supply of capital. (1.3)"],["c1","Based on size of investment and sophistication, investors are divided into:",["Debt and equity","Primary and secondary","Retail and institutional","Domestic and foreign"],2,"Retail investors invest on personal account. (1.3)"],["c1","A person who saves Rs. 5,000 monthly and buys mutual fund units is a:",["Institutional investor","Retail investor","Intermediary","Issuer"],1,"Retail investors are individuals investing on their personal account. (1.3)"],["c1","A mutual fund buying 50,000 shares of a company is a(n):",["Issuer of the shares","Regulator","Retail investor","Institutional investor"],3,"Institutional investors invest large sums with specialised skills. (1.3)"],["c1","A mutual fund collecting money from investors and investing it in the market is an example of:",["A regulator","An intermediary only","An issuer only","A rating agency"],2,"Mutual funds issue units to mobilise money and also invest as institutional investors. (1.3)"],["c1","Which of the following is an institutional investor \"by objective\"?",["A household","A retail shop","Mutual funds","A manufacturing company with surplus cash"],2,"Their primary business is to invest in securities. (1.3)"],["c1","Institutional investors manage returns and risk through formal processes for:",["Rating securities","Printing certificates","Settling trades","Evaluating, reviewing and managing the risk, return and holding periods"],3,"These are the three formal processes listed. (1.3)"],["c1","Government agencies:",["Issue equity securities","Cannot issue any securities","Issue only derivatives","Do not issue equity securities"],3,"Central and state governments issue debt securities to finance deficits. (1.3)"],["c1","Central and State Governments issue debt securities to meet:",["Equity needs","Listing fees","Requirements for short-term and long-term funds to finance deficits","Dividend payments"],2,"Deficit is the extent to which expenses are not met by income. (1.3)"],["c1","Local governments and municipalities may issue:",["Derivatives","Equity","Units of AIFs","Debt securities for development needs"],3,"Municipal bonds fund development needs. (1.3)"],["c1","Disinvestment programme refers to the government:",["Offering its holding in public sector companies to public investors","Issuing G-Secs","Buying shares of private companies","Cancelling securities"],0,"PSUs may issue securities to the public as part of disinvestment. (1.3)"],["c1","REITs, InvITs and AIFs are examples of:",["Depositories","Rating agencies","Regulators","Investment trusts that issue units"],3,"They mobilise money per their stated investment objectives. (1.3)"],["c1","Securities are issued in the name and under the common seal of the:",["Broker","Regulator","Depository","Issuer"],3,"Primary responsibility for meeting obligations rests with the issuer. (1.3)"],["c1","Since the mid-1990s securities have been issued in:",["Coin form","Paper form","Verbal form","Electronic form"],3,"Existing certificates were converted to electronic form. (1.3)"],["c1","The process of converting physical certificates into electronic form is called:",["Dematerialisation","Rematerialisation","Novation","Delisting"],0,"Dematerialisation enables electronic holding. (1.3)"],["c1","The regulations that list the intermediaries of the securities market are:",["Banking Regulation Act, 1949","Companies Act, 2013","FEMA, 1999","SEBI (Intermediaries) Regulations, 2008"],3,"They lay down the roles and responsibilities of intermediaries. (1.3)"],["c1","Which of the following is an intermediary under the SEBI (Intermediaries) Regulations, 2008?",["Customs officers","Income tax officers","Parliament","KYC registration agencies"],3,"KRAs are in the list of intermediaries. (1.3)"],["c1","Which of the following is NOT listed as an intermediary?",["Members of Parliament","Credit rating agencies","Custodians of securities","Investment advisers"],0,"The list includes AMCs, portfolio managers, merchant bankers, underwriters, brokers, APs, clearing members, etc. (1.3)"],["c1","Which intermediary is permitted to offer units representing participation in a pool of money?",["Portfolio managers","Registrars","Asset management companies","Brokers"],2,"Portfolio managers do not offer any security and cannot pool investor money. (1.3)"],["c1","Portfolio managers differ from AMCs in that they:",["Do not offer securities and do not pool money","Issue units","Are regulators","Pool money from investors"],0,"They act on behalf of the investor in creating and managing a portfolio. (1.3)"],["c1","A \"portfolio\" is:",["A single bond","A regulator's order","A group of securities","A bank account"],2,"The term describes a group of securities. (1.3)"],["c1","Merchant bankers are also called:",["Custodians","Issue managers, investment bankers or lead managers","Registrars","Trustees"],1,"They manage the issue process until listing. (1.3)"],["c1","Merchant bankers do which of the following?",["Only hold securities","Evaluate capital needs, structure the instrument, price it and manage the issue","Only settle trades","Only rate bonds"],1,"They engage registrars, brokers, bankers, underwriters and rating agencies. (1.3)"],["c1","Underwriting means:",["Holding securities","Promising to pick up the portion of an offer not bought by investors","Registering investors","Rating securities"],1,"It gives the issuer comfort about demand. (1.3)"],["c1","Specialist intermediaries performing underwriting in the government bond market are called:",["Primary dealers","Registrars","Custodians","Trustees"],0,"Primary dealers underwrite G-Sec issuance. (1.3)"],["c1","Stock brokers are:",["Regulators","Depositories","Rating agencies","Registered trading members of stock exchanges"],3,"All exchange transactions must go through registered brokers. (1.3)"],["c1","Authorised persons (APs) are:",["Agents of depositories","Agents of brokers, previously referred to as sub-brokers","Agents of SEBI","Agents of RBI"],1,"They are registered with the stock exchanges. (1.3)"],["c1","Brokers earn:",["A dividend","A salary from SEBI","Interest from RBI","A commission for their services"],3,"They may also provide research and recommendations. (1.3)"],["c1","Trading members put through trades:",["Only for issuers","Only for RBI","On their own behalf or for customers","Only for clearing"],2,"Clearing members settle the money and delivery. (1.3)"],["c1","Clearing members:",["Issue securities","Receive funds and securities for completed transactions and settle payments and deliveries","Register investors","Regulate exchanges"],1,"They are members of the stock exchange. (1.3)"],["c1","Bankers to an issue:",["Rate the issuer","Collect application forms and money from investors","Appoint trustees","Price the shares"],1,"They report collections to lead managers and transfer funds to the issuer. (1.3)"],["c1","Registrars and Share Transfer Agents maintain:",["Records of investors for the issuer","Price bands","Trading terminals","Index values"],0,"They record first holder, joint holders, nominations and so on. (1.3)"],["c1","Investor records maintained by RTAs are used for:",["Determining first and joint holders, address, bank details, signatures and nominations","Price discovery","Pricing derivatives","Setting dividend rates"],0,"These are legal purposes. (1.3)"],["c1","Depository participants (DPs) are:",["Agents of the RBI","Agents of SEBI","Agents of the issuer","Agents of the depositories"],3,"They open investor accounts to hold dematerialised securities. (1.3)"],["c1","Investor-level accounts in securities are held and maintained by:",["SEBI","The DP","The depository","The RBI"],1,"The company-level accounts are held by the depository. (1.3)"],["c1","Company-level accounts of securities issued are held and maintained by the:",["Broker","DP","Banker to the issue","Depository"],3,"Securities are admitted for dematerialisation after the issuer applies and pays a fee. (1.3)"],["c1","Who typically offers DP services?",["Only RBI","Only SEBI","Brokers and banks","Only exchanges"],2,"DPs help investors receive and deliver securities. (1.3)"],["c1","Custodians typically work with:",["Institutional investors","Only the RBI","Retail investors only","Only issuers"],0,"They hold securities and bank accounts on behalf of institutions. (1.3)"],["c1","Custodians are usually:",["Rating agencies","Large banks","Government departments","Individual brokers"],1,"They manage delivery of securities and money after a trade. (1.3)"],["c1","Custodians may also:",["Account for expenses and value the portfolio of institutional investors","List shares","Set the repo rate","Issue bonds"],0,"This is described in the workbook. (1.3)"],["c1","Trustees are appointed when:",["Shares are listed","Beneficiaries cannot directly supervise the management of their money","A broker is appointed","Dividends are paid"],1,"Mutual fund trustees supervise asset managers. (1.3)"],["c1","Debenture trustees are appointed to:",["Ensure that lenders' interests are protected","Manage the portfolio","Price the issue","Set interest rates"],0,"They protect the debenture holders. (1.3)"],["c1","Credit rating agencies provide:",["Margin funding","Settlement guarantees","A professional opinion on the issuer's ability to pay interest and principal","Stock tips"],2,"Rating symbols help assess default risk. (1.3)"],["c1","Investment advisers:",["Settle trades","Regulate brokers","Issue units","Help investors choose securities based on needs, time horizon, return expectations and risk capacity"],3,"They also create financial plans. (1.3)"],["c1","KYC Registration Agencies (KRAs) provide:",["A centralised system where KYC information uploaded by intermediaries is maintained","Credit ratings","Settlement guarantee","Trading platforms"],0,"KYC once completed is valid across all SEBI-registered intermediaries. (1.3)"],["c1","KYC done with one SEBI-registered intermediary is valid:",["Only with that intermediary","Only for mutual funds","Across all SEBI-registered intermediaries","Only for brokers"],2,"It applies across the capital market. (1.3)"],["c1","SEBI has mandated that KRAs share data with other KRAs through:",["Open outcry","Novation","Netting","Inter-operability process (IOP)"],3,"This avoids inconvenience in KYC documentation. (1.3)"],["c1","KRAs validate client details through UIDAI for Aadhaar, OTP for mobile/email, and which database for PAN?",["Electoral database","Income Tax database","Passport database","RTO database"],1,"These are the three validation routes. (1.3)"],["c1","KRAs may share information with other regulators such as RBI, IRDAI and PFRDA:",["Without any notification","If the respective regulators notify so","Never","Only for fees"],1,"This is allowed on notification. (1.3)"],["c1","The KRA investor charter explains:",["Trading hours","Dividend policy","Margin rates","Services, investor rights, key functions, do's and don'ts and grievance redressal"],3,"SEBI requires KRAs to share it via websites, emails and office displays. (1.3)"],["c1","All intermediaries in the securities market must be:",["Registered with SEBI","Unregistered","Registered with RBI only","Registered with MCA only"],0,"They must also follow a SEBI-mandated code of conduct. (1.3)"],["c1","Which is a key point in the SEBI code of conduct for intermediaries?",["Withhold information","Collude with other intermediaries","Protect investor interests and give fair, professional and skilled service","Ignore infrastructure"],2,"The code also stresses timely information and sound infrastructure. (1.3)"],["c1","Responsibility for regulating the securities market is shared by SEBI, RBI, DEA and:",["MCA","EPFO","SIDBI","NABARD"],0,"The Ministry of Corporate Affairs is one of the four. (1.3)"],["c1","SEBI is a statutory body set up under:",["The Companies Act","FEMA","The Banking Regulation Act","The SEBI Act, 1992"],3,"It is the chief regulator of securities markets and functions under the Ministry of Finance. (1.3)"],["c1","The main objective of SEBI is to:",["Set the repo rate","Run exchanges","Facilitate growth and development of capital markets and protect investors' interests","Issue currency"],2,"This is stated in the workbook. (1.3)"],["c1","The Securities Contracts (Regulation) Act, 1956 is administered by:",["SEBI","RBI","MCA","IRDAI"],0,"It provides control over trading and the running of stock exchanges. (1.3)"],["c1","For recognition of a stock exchange, the Central Government can nominate representatives, not exceeding:",["Three","One","Ten","Five"],0,"This is a requirement for gra lions of buyers and sellers","The regulator","The depository"],1,"It is one of the main functions of the securities market. (1.4)"],["c1","A company reports losses due to declining market share and its share price drops. This illustrates:",["Productive investment","Orderly channel for transfer of funds","Liquidity","Information signalling through prices"],3,"Prices quickly reflect information on the issuer. (1.4)"],["c1","A poor monsoon causing fertiliser company share prices to fall is an example of:",["Underwriting","Information signalling through prices","Listing","Dematerialisation"],1,"Falling prices signal likely lower sales and profits. (1.4)"],["c1","Information signalling through prices is particularly useful for:",["Only issuers","Only regulators","Small investors with limited access to information","Only large institutions"],2,"Prices reflect information quickly. (1.4)"],["c1","A well-developed securities market is usually associated with:",["Weak growth","Decline in savings","No growth","Strong economic growth"],3,"Securities markets enable efficient allocation of capital. (1.4)"],["c1","Stock brokers in the 19th century met at:",["The banyan tree in front of Mumbai Town Hall","A screen-based platform","Mobile apps","Online portals"],0,"They transacted business in the streets of Fort, Mumbai. (1.5)"],["c1","In the 1990s, the stock market replaced \"pit trading\" or \"open outcry\" with:",["Screen-based electronic trading","Paper-based trading","Postal trading","Phone trading only"],0,"Technology later brought online and mobile trading. (1.5)"],["c1","Growth in electronic and internet trading exposed market intermediaries to the risk of:",["Cyber-attacks","Higher dividends","Lower volumes","Currency devaluation"],0,"This led SEBI to frame cyber security guidelines. (1.5)"],["c1","SEBI's framework on cyber security is called:",["Digital Trade Act","Anti-Cyber Code","Cyber Security and Cyber Resilience Framework (CSCRF)","Cyber Trading Framework"],2,"It applies to SEBI Regulated Entities in a phased manner. (1.5.1)"],["c1","Which of these are systemically important Market Infrastructure Institutions (MIIs)?",["Stock exchanges, depositories and clearing corporations","Only brokers","Only investment advisers","Only AMCs"],0,"Per CSCRF, KRAs and QRTAs are also constituted as MIIs. (1.5.1)"],["c1","Under the CSCRF, which of these is constituted as an MII?",["Credit rating agencies","Portfolio managers","KYC Registration Agencies","Investment advisers"],2,"The CSCRF list: stock exchanges, depositories, clearing corporations, KRAs and QRTAs. (1.5.1)"],["c1","QRTA stands for:",["Qualified Regulators of Trading Activity","Quality Rated Trust Account","Quick Registered Trading Agents","Qualified Registrars and Transfer Agents"],3,"QRTAs are MIIs under the CSCRF. (1.5.1)"],["c1","Cyber security encompasses:",["Only insurance","All tools, measures and processes intended to prevent cyber-attacks","Only recovery plans","Only audits"],1,"Cyber resilience measures the ability to prepare, respond, continue functioning and recover. (1.5.1)"],["c1","Cyber resilience measures an organisation's ability to:",["Avoid audits","Hide attacks","Prepare for and respond to an attack, continue functioning and recover","Prevent all attacks"],2,"It differs from cyber security, which focuses on prevention. (1.5.1)"],["c1","How many cyber resiliency goals does the CSCRF have?",["3","10","5","7"],2,"They are Anticipate, Withstand, Contain, Recover and Evolve. (1.5.1)"],["c1","Which is NOT one of the five cyber resiliency goals?",["Contain","Withstand","Ignore","Anticipate"],2,"The five are Anticipate, Withstand, Contain, Recover and Evolve. (1.5.1)"],["c1","\"Maintain a state of informed preparedness from adversary attacks\" is the goal of:",["Anticipate","Contain","Recover","Withstand"],0,"It is the first resiliency goal. (1.5.1)"],["c1","\"Continue essential business functions at times of adversary attacks\" describes:",["Recover","Evolve","Anticipate","Withstand"],3,"Essential functions must continue during attacks. (1.5.1)"],["c1","\"Localise containment of crisis and isolate trusted functions from untrusted ones\" describes:",["Anticipate","Contain","Evolve","Recover"],1,"It enables business operations to continue. (1.5.1)"],["c1","\"Restore business functions to the maximum extent after attacks\" describes:",["Recover","Anticipate","Contain","Withstand"],0,"It is the fourth goal. (1.5.1)"],["c1","\"Change business functions and supporting cyber capabilities to minimise adverse impacts of attacks\" describes:",["Withstand","Recover","Evolve","Contain"],2,"It is the fifth goal. (1.5.1)"],["c1","The cybersecurity functions in the CSCRF include:",["Issue, List, Trade","Governance, Identify, Protect, Detect, Respond and Recover","Buy, Sell, Hold","Invest, Save, Spend"],1,"Governance is the overarching function. (1.5.1)"],["c1","Under the CSCRF, the Governance function requires REs to:",["Avoid documentation","Prepare a comprehensive cybersecurity and cyber resilience policy approved by the Board/Partner/Proprietor","Outsource all accountability","Share passwords"],1,"REs are solely accountable for third-party services and compliance. (1.5.1)"],["c1","Under CSCRF, accountability for third-party services lies:",["With the customer","Solely with the vendor","With SEBI","Solely with the RE"],3,"REs must ensure compliance with SEBI and Government rules. (1.5.1)"],["c1","The \"Identify\" function requires REs to:",["Ignore risks","Identify and classify critical systems based on sensitivity and criticality","Hide critical systems","Sell critical systems"],1,"The Board approves the list of critical systems. (1.5.1)"],["c1","Who approves the list of critical systems under CSCRF?",["The depository","Board/Partner/Proprietor","The customer","The RTA"],1,"The RE must also identify cyber risks to such assets. (1.5.1)"],["c1","Under the \"Protect\" function, access to systems should be:",["Shared across vendors","Granted to ates rise, prices fall. (5.3.2)"],["c5","A longer-tenor debt security shows a ___ change in value when interest rates change.",["No","Greater","Zero","Smaller"],1,"The impact is greater for higher tenor. (5.3.2)"],["c5","A fund with short-term securities earns primarily:",["Capital gains","Coupon income with very low MTM gains or losses","Bonus","Dividends"],1,"It is less affected by interest rate moves. (5.3.2)"],["c5","A fund holding long-term securities benefits more when interest rates:",["Stay flat","Rise","Fall","Are volatile only"],2,"Higher MTM gains arise. (5.3.2)"],["c5","Credit risk of a debt fund is indicated by:",["The expense ratio","The credit rating of securities held","The riskometer only","The NAV"],1,"Lower rated papers pay higher coupons. (5.3.2)"],["c5","An Overnight Fund invests in securities with maturity of:",["91 days","1 year","1 day","3 years"],2,"It is a debt scheme. (5.3.2)"],["c5","A Liquid Fund invests in debt and money market securities with maturity up to:",["1 year","91 days","6 months","1 day"],1,"It is an open ended liquid scheme. (5.3.2)"],["c5","An Ultra Short Term Fund has Macaulay duration between:",["1 and 3 months","6 and 12 months","3 months and 6 months","1 and 3 years"],2,"Low duration is 6 to 12 months. (5.3.2)"],["c5","The \"Ultra Short to Short Term\" (low duration) fund has Macaulay duration of:",["3 to 4 years","3 to 6 months","6 to 12 months","1 to 3 years"],2,"It invests in debt and money market instruments. (5.3.2)"],["c5","A Money Market Fund invests in instruments with maturity up to:",["1 year","3 years","91 days","1 day"],0,"It is an open ended debt scheme. (5.3.2)"],["c5","A Short Term Fund has Macaulay duration between:",["4 and 7 years","3 months and 6 months","1 year and 3 years","3 and 4 years"],2,"It is an open ended debt scheme. (5.3.2)"],["c5","A Medium Term Fund has Macaulay duration between:",["Above 7 years","3 years and 4 years","4 and 7 years","1 and 3 years"],1,"Under adverse situation, 1 to 4 ye  <div class="row" style="margin-bottom:6px"><button id="all">Select all</button><button id="none">Clear</button></div>
 ${SETS.map((s,k)=>`<div class="set"><input type="checkbox" id="c${s.id}" ${S.sel.has(s.id)?'checked':''}><label for="c${s.id}">${esc(s.name)} <small>(${counts[k]} questions)</small></label></div>`).join('')}</div>
 <div class="card"><h2>2. Mode and length</h2>
 <div class="seg" id="mode"><button data-m="practice" class="${S.mode==='practice'?'on':''}">Practice (instant feedback)</button><button data-m="exam" class="${S.mode==='exam'?'on':''}">Exam (timed, score at end)</button></div>
 <div class="row" style="margin-top:12px"><label>Number of questions
 <select id="n">${[10,25,50,100,200,500].map(v=>`<option ${S.n===v?'selected':''}>${v}</option>`).join('')}<option value="0" ${S.n===0?'selected':''}>All selected</option></select></label></div>
 <p class="sub" style="margin:10px 0 0">Exam mode runs on a timer of 36 seconds per question, so 200 questions get exactly 2 hours (100 questions get 1 hour). Questions are drawn at random and the pass mark used here is 60%.</p></div>
 <button class="p" id="go" style="width:100%;padding:14px">Start</button>
 <div class="card" style="margin-top:14px"><h2>Your recent attempts</h2>${hist.length?`<table><tr><th>When</th><th>Mode</th><th>Score</th></tr>${hist.slice(0,8).map(h=>`<tr><td>${esc(h.d)}</td><td>${h.m}</td><td>${h.c}/${h.t} (${h.p}%)</td></tr>`).join('')}</table><div style="margin-top:10px"><button id="clr">Clear history</button></div>`:'<p class="sub" style="margin:0">No attempts yet. Your results are saved on this device.</p>'}</div>`;
 SETS.forEach(s=>$('#c'+s.id).onchange=e=>{e.target.checked?S.sel.add(s.id):S.sel.delete(s.id)});
 $('#all').onclick=()=>{S.sel=new Set(SETS.map(s=>s.id));home()};$('#none').onclick=()=>{S.sel=new Set();home()};
 document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;home()});
 $('#n').onchange=e=>S.n=+e.target.value;
 $('#go').onclick=start;
 const c=$('#clr');if(c)c.onclick=()=>{store('nism_hist',[]);home()};
}
function start(){
 let pool=DATA.filter(q=>S.sel.has(q[0]));
 if(!pool.length){ask('Please select at least one set first.',null,true);return}
 pool=shuffle(pool);if(S.n>0)pool=pool.slice(0,S.n);
 S.qs=pool;S.i=0;S.ans=pool.map(()=>null);S.flag=pool.map(()=>false);S.fin=false;S.t=pool.length*36;
 clearInterval(S.timer);
 if(S.mode==='exam'){S.timer=setInterval(()=>{S.t--;const e=$('#tm');if(e)e.textContent=fmt(S.t);if(S.t<=0)finish()},1000)}
 quiz();
}
function fmt(s){s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')}
function quiz(){
 const q=S.qs[S.i],a=S.ans[S.i],ex=S.mode==='practice',done=a!==null;
 const set=SETS.find(s=>s.id===q[0]);
 const opts=q[2].map((o,k)=>{let c='opt';if(ex&&done){if(k===q[3])c+=' ok';else if(k===a)c+=' no'}else if(a===k)c+=' sel';return `<button class="${c}" data-k="${k}" ${ex&&done?'disabled':''}><b>${'ABCD'[k]}</b><span>${esc(o)}</span></button>`}).join('');
 const answered=S.ans.filter(x=>x!==null).length;
 app.innerHTML=`<div class="top"><button id="quit">Exit</button>${S.mode==='exam'?'<button class="p" id="sub2">Submit</button>':''}${S.mode==='exam'?`<div class="meta"><span>Time left: <b id="tm">${fmt(S.t)}</b></span></div>`:`<div class="meta"><span>Correct so far: <b>${S.ans.filter((x,i)=>x===S.qs[i][3]).length}</b>/${answered}</span></div>`}</div>
 <div class="bar"><i style="width:${(S.i+1)/S.qs.length*100}%"></i></div>
 <div class="card"><div class="meta"><span><span class="tag">${esc(set.short)}</span>Question ${S.i+1} of ${S.qs.length}</span><span>${S.mode==='exam'?`<button id="fl" style="padding:4px 10px">${S.flag[S.i]?'Unflag':'Flag'}</button>`:''}</span></div>
 <div class="q">${esc(q[1])}</div>${opts}
 ${ex&&done?`<div class="ex"><b>${a===q[3]?'Correct.':'Not quite. Correct answer: '+'ABCD'[q[3]]+'.'}</b> ${esc(q[4])}</div>`:''}</div>
 <div class="row"><button id="pv" ${S.i===0?'disabled':''}>Previous</button><button class="p" id="nx" style="flex:1">${S.i===S.qs.length-1?(ex?'Finish':'Review and submit'):'Next'}</button></div>
 ${S.mode==='exam'?`<div class="card" style="margin-top:14px"><div class="meta"><span>Answered ${answered} of ${S.qs.length}</span><span>Flagged ${S.flag.filter(Boolean).length}</span></div><div class="pal">${S.qs.map((_,k)=>`<button data-p="${k}" class="${S.ans[k]!==null?'d':''} ${S.flag[k]?'f':''} ${k===S.i?'c':''}">${k+1}</button>`).join('')}</div><div style="margin-top:12px"><button id="sub">Submit exam now</button></div></div>`:''}`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.ans[S.i]=+b.dataset.k;quiz()});
 $('#pv').onclick=()=>{S.i--;quiz()};
 $('#nx').onclick=()=>{if(S.i<S.qs.length-1){S.i++;quiz()}else if(ex)finish();else{ask('Submit your exam now? Unanswered: '+S.ans.filter(x=>x===null).length,finish)}};
 $('#quit').onclick=()=>ask('Exit this quiz? Progress will be lost.',()=>{clearInterval(S.timer);home()});
 const f=$('#fl');if(f)f.onclick=()=>{S.flag[S.i]=!S.flag[S.i];quiz()};
 const sb=$('#sub');if(sb)sb.onclick=()=>ask('Submit your exam now? Unanswered: '+S.ans.filter(x=>x===null).length,finish);const s2=$('#sub2');if(s2)s2.onclick=()=>ask('Submit your exam now? Unanswered: '+S.ans.filter(x=>x===null).length,finish);
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.i=+b.dataset.p;quiz()});
}
function finish(){
 clearInterval(S.timer);S.fin=true;
 const tot=S.qs.length,ok=S.qs.filter((q,i)=>S.ans[i]===q[3]).length,pct=Math.round(ok/tot*100);
 const h=store('nism_hist')||[];h.unshift({d:new Date().toLocaleString(),m:S.mode==='exam'?'Exam':'Practice',c:ok,t:tot,p:pct});store('nism_hist',h.slice(0,30));
 result('all');
}
function result(f){
 const tot=S.qs.length,ok=S.qs.filter((q,i)=>S.ans[i]===q[3]).length,pct=Math.round(ok/tot*100),un=S.ans.filter(x=>x===null).length;
 const by=SETS.map(s=>{const ix=S.qs.map((q,i)=>q[0]===s.id?i:-1).filter(i=>i>=0);const c=ix.filter(i=>S.ans[i]===S.qs[i][3]).length;return{s,n:ix.length,c}}).filter(r=>r.n);
 const list=S.qs.map((q,i)=>({q,i,a:S.ans[i]})).filter(r=>f==='all'||(f==='wrong'&&r.a!==r.q[3]));
 app.innerHTML=`<h1>Your result</h1><div class="card"><div class="big ${pct>=60?'pass':'fail'}">${ok} / ${tot}</div><p style="margin:6px 0 0"><b>${pct}%</b> correct. ${pct>=60?'This is above the 60% pass mark.':'This is below the 60% pass mark. Review the explanations below and try again.'}${un?` Unanswered: ${un}.`:''}</p></div>
 <div class="card"><h2>By set</h2><table><tr><th>Set</th><th>Score</th><th>%</th></tr>${by.map(r=>`<tr><td>${esc(r.s.name)}</td><td>${r.c}/${r.n}</td><td>${Math.round(r.c/r.n*100)}%</td></tr>`).join('')}</table></div>
 <div class="row" style="margin-bottom:14px"><button class="p" id="again">Back to home</button><button id="rw" ${ok===tot?'disabled':''}>Retry wrong answers</button><button id="fa" class="${f==='all'?'on':''}">Show all</button><button id="fw">Show wrong only</button></div>
 <div class="card"><h2>Review (${list.length})</h2>${list.map(r=>`<div class="rv"><div class="meta"><span><span class="tag">${esc(SETS.find(s=>s.id===r.q[0]).short)}</span>Q${r.i+1}</span><span class="${r.a===r.q[3]?'pass':'fail'}">${r.a===null?'Unanswered':r.a===r.q[3]?'Correct':'Wrong'}</span></div><div class="q" style="font-size:1rem">${esc(r.q[1])}</div>${r.q[2].map((o,k)=>`<div style="padding:3px 0;${k===r.q[3]?'color:var(--ok);font-weight:600':k===r.a?'color:var(--no)':''}">${'ABCD'[k]}) ${esc(o)}${k===r.q[3]?' (correct)':k===r.a?' (your answer)':''}</div>`).join('')}<div class="ex">${esc(r.q[4])}</div></div>`).join('')||'<p class="sub">Nothing to show.</p>'}</div>`;
 $('#again').onclick=home;$('#fa').onclick=()=>result('all');$('#fw').onclick=()=>result('wrong');
 $('#rw').onclick=()=>{const w=S.qs.filter((q,i)=>S.ans[i]!==q[3]);S.qs=shuffle(w);S.i=0;S.ans=w.map(()=>null);S.flag=w.map(()=>false);S.mode='practice';quiz()};
}
home();
</script></body></html>
